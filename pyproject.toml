[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regeval"
version = "0.1.0"
description = "Catch LLM output regressions before they ship — pytest-style evaluation with a CI action that comments on your pull requests."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amogha", email = "amoghagrao@gmail.com" }
]
requires-python = ">=3.9"
keywords = ["llm", "evaluation", "testing", "regression", "ai", "cli", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
caching = ["flightlock>=0.1.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "flightlock>=0.1.0",
]

[project.scripts]
regeval = "regeval.cli:main"

[project.urls]
Homepage = "https://github.com/raoamogh/regeval"
Repository = "https://github.com/raoamogh/regeval"
Issues = "https://github.com/raoamogh/regeval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=regeval --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]